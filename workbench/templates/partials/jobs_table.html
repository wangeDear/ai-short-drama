<div id="jobs-table" class="panel table-wrap" hx-get="{{ table_url }}" hx-trigger="every 3s" hx-swap="outerHTML">
  {% if jobs %}
  <table class="table jobs-table">
    <thead>
      <tr>
        <th>状态</th><th>类型</th><th>项目 / 分镜</th><th>节点</th><th>当前步骤</th>
        <th>进度</th><th>优先级</th><th>排队 / 开始</th><th>耗时</th><th>操作</th>
      </tr>
    </thead>
    <tbody>
      {% for job in jobs %}
        {% include "partials/job_row.html" %}
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div class="empty">没有符合条件的任务。</div>
  {% endif %}
</div>
