{% extends "base.html" %}
{% set nav_active = 'jobs' %}
{% block title %}任务中心{% endblock %}
{% block content %}
<div class="page-head">
  <h1>任务中心</h1>
  <div class="page-head-actions">
    <span class="hint">{{ nav.running_jobs }} 生成中 · {{ nav.queued_jobs }} 排队（每 3 秒自动刷新）</span>
  </div>
</div>

<form method="get" action="/jobs" class="filter-bar" data-nopersist>
  <label>状态
    <select name="status">
      <option value="">全部</option>
      {% for status in ['queued', 'running', 'succeeded', 'failed', 'cancelled'] %}
      <option value="{{ status }}" {{ 'selected' if status_filter == status }}>{{ job_status_labels[status] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>项目
    <select name="project">
      <option value="">全部</option>
      {% for project in projects %}
      <option value="{{ project.id }}" {{ 'selected' if project_filter == project.id }}>{{ project.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button class="btn" type="submit">筛选</button>
  <a class="btn ghost" href="/jobs">重置</a>
</form>

{% include "partials/jobs_table.html" %}
{% endblock %}
